    <style>
      :root {
        --navy: #1f3a5f;
        --navy-deep: #142a47;
        --amber-soft: #f3e4cb;
        --paper: #f5f7fa;
        --line: #dbe2ec;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--paper);
        font-family: "Space Grotesk", "Segoe UI", Roboto, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      header {
        background: linear-gradient(135deg, var(--navy-deep), var(--navy));
        color: #f0f3f8;
        padding: 22px 24px 16px;
        flex-shrink: 0;
      }

      header .eyebrow {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--amber-soft);
        font-weight: 600;
        margin-bottom: 4px;
      }

      header h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .nav-row {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }

      .nav-btn {
        appearance: none;
        -webkit-appearance: none;
        font-family: inherit;
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
        padding: 9px 18px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #c3cfe0;
        background: none;
        cursor: pointer;
      }

      .nav-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .nav-btn.active {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.45);
      }

      .refresh-btn {
        margin-left: auto;
        appearance: none;
        -webkit-appearance: none;
        font-family: inherit;
        font-size: 15px;
        line-height: 1;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #c3cfe0;
        background: none;
        cursor: pointer;
      }

      .refresh-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .refresh-btn:active {
        transform: rotate(180deg);
        transition: transform 0.3s ease;
      }

      .frame-wrap {
        flex: 1;
        position: relative;
        background: #fff;
      }

      .frame-wrap iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        display: none;
      }

      .frame-wrap iframe.active {
        display: block;
      }

      .loading-hint {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9aa8bd;
        font-size: 13px;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="eyebrow">Kalender Kegiatan</div>
      <h1>Jadwal Agenda UPT BKN Semarang</h1>
      <div class="nav-row">
        <button
          type="button"
          class="nav-btn active"
          id="tabKalenderBtn"
          onclick="switchTab('kalender')"
        >
          🏠 Home
        </button>
        <button
          type="button"
          class="nav-btn"
          id="tabStatistikBtn"
          onclick="switchTab('statistik')"
        >
          📊 Statistik
        </button>

        <button
          type="button"
          class="nav-btn"
          id="tabAdminBtn"
          onclick="switchTab('admin')"
        >
          ⚙️ Admin
        </button>

        <button
          type="button"
          class="refresh-btn"
          id="refreshBtn"
          title="Muat ulang halaman"
          onclick="refreshTab()"
        >
          🔄
        </button>
      </div>
    </header>

    <div class="frame-wrap">
    <div class="loading-hint" id="loadingHint">Memuat...</div>
    <iframe id="frameKalender" class="active" title="Kalender Agenda"></iframe>
    <iframe id="frameStatistik" title="Statistik Agenda"></iframe>
    <iframe id="frameAdmin" title="Panel Admin"></iframe>
  </div>

    <script>
      // GANTI URL INI dengan URL hasil deploy Apps Script kamu (yang berakhiran /exec)
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbxkzuT0_lqNdBRIu9Aiq8aqd-6tUfa2BxWbptn86uUNoOnI66YrtmXCiJpPY9aOGChxwg/exec";

      const frames = {
      kalender: document.getElementById('frameKalender'),
      statistik: document.getElementById('frameStatistik'),
      admin: document.getElementById('frameAdmin')
    };
    const buttons = {
      kalender: document.getElementById('tabKalenderBtn'),
      statistik: document.getElementById('tabStatistikBtn'),
      admin: document.getElementById('tabAdminBtn')
    };
      const loadingHint = document.getElementById("loadingHint");
      const loaded = { kalender: false, admin: false };
          const pageParam = { kalender: 'index', statistik: 'statistic', admin: 'admin' };


      function switchTab(tab) {
      Object.keys(frames).forEach(key => {
        frames[key].classList.toggle('active', key === tab);
        buttons[key].classList.toggle('active', key === tab);
      });
      if (!loaded[tab]) {
        loadingHint.style.display = 'flex';
        frames[tab].onload = () => { loadingHint.style.display = 'none'; };
        frames[tab].src = SCRIPT_URL + '?page=' + pageParam[tab];
        loaded[tab] = true;
      } else {
        loadingHint.style.display = 'none';
      }
    }

      // Muat tab pertama saat halaman dibuka
      switchTab("kalender");

      function refreshTab() {
        const active = Object.keys(frames).find((key) =>
          frames[key].classList.contains("active")
        );
        if (!active) return;
        loadingHint.style.display = "flex";
        frames[active].onload = () => { loadingHint.style.display = "none"; };
        frames[active].src =
          SCRIPT_URL + "?page=" + pageParam[active] + "&_t=" + Date.now();
      }
    </script>

      data-cf-beacon='{"version":"2024.11.0","token":"33fd24d3050443afab8c4cc63fa08075","r":1}'
      crossorigin="anonymous"
    ></script>
  </body>
